<line x1="494" y1="260" x2="786" y2="260" stroke="#e3e0d7"/>
<text x="494" y="292" fill="#17171a" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:600">Busca antes de ler</text>
<text x="494" y="318" fill="#5d5b55" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px">rg acha a linha e a IA lê só a</text>
<text x="494" y="338" fill="#5d5b55" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px">fatia, não o arquivo todo</text>

<g transform="translate(56 110)"><rect x="110" y="44" width="168" height="92" rx="5" fill="#ffffff" stroke="#e3e0d7"/><rect x="98" y="34" width="168" height="92" rx="5" fill="#ffffff" stroke="#e3e0d7"/><rect x="86" y="24" width="168" height="92" rx="5" fill="#ffffff" stroke="#d3cfc4"/><rect x="98" y="38" width="3" height="18" fill="#c93f22"/><rect x="108" y="44" width="90" height="6" rx="3" fill="#17171a"/>

<text x="56" y="62" fill="#17171a" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:600">De onde vem a economia</text>
<text x="56" y="90" fill="#5d5b55" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px">Três hábitos que o kit põe na sua IA.</text>

<text x="908" y="292" fill="#17171a" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:600">Erro não se repete</text>
<text x="908" y="318" fill="#5d5b55" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px">o que custou caro vira regra</text>
<text x="908" y="338" fill="#5d5b55" style="font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px">escrita onde a próxima sessão lê</text>
